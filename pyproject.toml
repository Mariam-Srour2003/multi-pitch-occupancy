[project]
name = "pitch-occupancy"
version = "0.1.0"
description = "Low-bandwidth, CPU-only computer vision for multi-pitch occupancy and booking verification"
readme = "README.md"
authors = [
    { name = "Mariam-Srour2003", email = "mariammsrourr2020@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    # vision / imaging
    "opencv-python>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    # models
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "open-clip-torch>=2.24",
    "ultralytics>=8.3",
    # data / ml
    # scikit-learn and scipy are PINNED, not floated. Windows Smart App Control on the
    # development machine blocks the newer builds' native extensions outright
    # (`ImportError: ... An Application Control policy has blocked this file` for
    # sklearn's _flow and scipy's _csparsetools). 1.8.0 / 1.16.3 load fine. Raise these
    # only after confirming the new build imports on the target machine.
    "scikit-learn==1.8.0",
    "scipy==1.16.3",
    "pandas>=2.2",
    "imagehash>=4.3",
    # figures
    "matplotlib>=3.9",
    # service layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # cli / ux
    "typer>=0.12",
    "tqdm>=4.66",
]

[project.scripts]
pitch = "pitch_occupancy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# CPU-only torch.
# The thesis constraint is CPU-only inference on commodity edge hardware, so the
# CUDA wheels are never installed - on any platform, including the Linux Mini-PC.
# This keeps the lockfile honest about what the reported latencies were measured on.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: touches a real backbone or real footage; excluded from the fast loop",
]
