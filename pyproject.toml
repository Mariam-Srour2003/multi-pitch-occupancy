[project]
name = "pitch-occupancy"
version = "0.1.0"
description = "Low-bandwidth, CPU-only computer vision for multi-pitch occupancy and booking verification"
readme = "README.md"
authors = [
    { name = "Mariam-Srour2003", email = "mariammsrourr2020@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    # vision / imaging
    "opencv-python>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    # models: the YOLO detector (ultralytics needs torch and torchvision)
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    # data
    # scipy is not imported by this package; it comes in through imagehash, and is PINNED,
    # not floated. Windows Smart App Control on the development machine blocks newer builds'
    # native extensions outright (`ImportError: ... An Application Control policy has
    # blocked this file` for scipy's _csparsetools). 1.16.3 loads fine. Raise it only after
    # confirming the new build imports on the target machine.
    "scipy==1.16.3",
    "pandas>=2.2",
    "imagehash>=4.3",
    # figures
    "matplotlib>=3.9",
    # service layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # cli / ux
    "typer>=0.12",
    "tqdm>=4.66",
]

[project.scripts]
pitch = "pitch_occupancy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# CPU-only torch.
# The design constraint is CPU-only inference on commodity edge hardware, so the
# CUDA wheels are never installed - on any platform, including the Linux Mini-PC.
# This keeps the lockfile honest about what the reported latencies were measured on.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Query()/Depends() and typer's Option()/Argument() are declared as defaults by
# design; that is what B008 flags.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS strings; wrapping would be awkward.
"src/pitch_occupancy/api/*_page.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repository root on the path for tests, so top-level directories that are not
# part of the installed package (such as scripts/) stay importable from a test.
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: touches the real detector or real footage; excluded from the fast loop",
]
