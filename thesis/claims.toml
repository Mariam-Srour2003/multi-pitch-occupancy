# --- WP4-T1: the four protocols --------------------------------------------------------

[[claim]]
id = "constant-predictor-wins-cross-venue"
statement = "Under leave-one-venue-out a constant predictor scores macro-F1 1.000, ahead of every backbone, because every held-out venue is 100% active play."
value = 1.0
where = ["README.md", "thesis/rq_matrix.md"]
source = "results/benchmark_v2.csv"
select = { protocol = "lo_venue_out", model = "majority" }
column = "macro_f1"
aggregate = "mean"

[[claim]]
id = "composition-drop-zero-shot"
statement = "A model that never trains drops 0.183 macro-F1 on the same change of test set, so that much of every leakage penalty is test-set composition."
value = 0.1834
where = ["README.md", "thesis/rq_matrix.md"]
source = "results/benchmark_v2.csv"
select = { protocol = "random_minus_grouped", model = "convnextv2" }
column = "majority_share_test"
note = "Stored in that column because the summary rows reuse the schema; the header of the row names it composition_drop_from_zero_shot_control."

[[claim]]
id = "leakage-attributable-dinov2"
statement = "DINOv2's leakage-attributable drop is 0.3323 once the composition effect is subtracted, against a raw drop of 0.5158."
value = 0.5158
where = ["thesis/rq_matrix.md"]
source = "results/benchmark_v2.csv"
select = { protocol = "random_minus_grouped", model = "dinov2" }
column = "macro_f1"
note = "The raw drop is stored; the attributable figure is this minus the composition claim above."

