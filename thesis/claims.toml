column = "empty_accuracy"
note = "The guard on reading a low false-play rate as competence. The mechanism is the training mix - 518 ACTIVE_PLAY, 251 EMPTY, 6 MAINTENANCE, with class_weight=balanced giving the six-frame class a weight of 43 - so out-of-distribution frames land in MAINTENANCE. `where` is empty until this reaches the write-up; the ledger still re-derives the value."

