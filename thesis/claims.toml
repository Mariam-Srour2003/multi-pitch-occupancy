# The claims ledger (WP8-T5).
#
# Every quantitative claim the write-up makes, with the artefact that produced it and enough
# of a locator to re-derive it. `experiments/verify_claims.py` re-derives each value from its
# source, checks it against the number recorded here, and checks that the same number appears
# in each document listed under `where`.
#
# So a claim can fail in three ways and each is a different problem:
#   - the source no longer produces the value  -> the result changed and the prose did not;
#   - the value is absent from a `where` file  -> the prose changed and the ledger did not;
#   - the claim has no source at all           -> it is unsupported, and says so.
#
# This exists because the failure it prevents has already happened here repeatedly: a figure
# with its scores hardcoded contradicted its own CSV, a README described a project that had
# not started, an export stopped covering the thesis, and a diagnostic was quoted for a day
# before a second measurement retracted it. None of those were noticed by a test.
#
# `where` lists the *live* documents a claim appears in - README, the RQ matrix, the
# protocol, the pre-registration - not `results/EXPERIMENT_LOG.md`. The log is append-only
# history: an entry there records what was true when it was written, and superseded entries
# stay as written with a retraction beside them. Requiring the log to match current values
# would forbid keeping that history, which is the opposite of the point.
#
# Add a claim when you write the sentence, not at the end.

# --- H1: what leakage-free evaluation costs -------------------------------------------

[[claim]]
id = "h1-drop-convnextv2"
statement = "Moving from a same-scene random split to a grouped one costs ConvNeXtV2 0.4904 macro-F1 — the score roughly halves."
value = -0.4904
where = ["thesis/rq_matrix.md"]
note = "The README states this approximately on purpose (\"falls from ~0.99 to ~0.50\"); the precise delta lives in the RQ matrix, so only that document is checked for it."
source = "results/h1_h2_baseline_floor.csv"
select = { split = "grouped_slot_id_seed42", model = "convnextv2" }
column = "macro_f1"
minus_select = { split = "random_seed42", model = "convnextv2" }
minus_column = "macro_f1"

[[claim]]
id = "h1-grouped-convnextv2"
statement = "Under the grouped split ConvNeXtV2 scores 0.4975 macro-F1 — the score of a model that never recognises an empty pitch."
value = 0.4975
where = ["thesis/rq_matrix.md"]
source = "results/h1_h2_baseline_floor.csv"
select = { split = "grouped_slot_id_seed42", model = "convnextv2" }
