# --- WP4-T13: what the false-play control actually measures ------------------------------

[[claim]]
id = "camera-transfer-one-frame"
statement = "One labelled empty frame of the held-out camera takes DINOv2 from 0.0000 to 0.9793 empty-pitch accuracy; without it the model has never seen that camera and gets none of the 243 right."
value = 0.9793
where = []
source = "results/empty_recognition.csv"
select = { backbone = "dinov2", configuration = "A_plus_B_play_plus_01_empties" }
column = "empty_accuracy"
note = "Read with its two caveats, both in the source table: the 243 held-out empty frames are 3 distinct scenes, which is *why* one frame suffices, and every k-shot row carries the count of near-duplicate pairs crossing the train/test boundary - 1,400 already at k=1. `where` is empty until this reaches the write-up."

[[claim]]
id = "onboarding-one-frame"
statement = "One labelled frame of a new camera takes DINOv2 from 0.441 to 0.990 macro-F1 on that camera's unseen frames."
value = 0.9895
where = []
source = "results/onboarding_cost.csv"
select = { backbone = "dinov2", k = "1" }
column = "adapted_mean"
note = "An optimistic bound on onboarding a new *venue*: a second camera on the same pitch is an easier target than a new site, and leave-one-venue-out adaptation is not runnable here because only one of eight venues carries more than one class. Read beside the source table's leak column - camera B is 12 distinct scenes, which is why a single frame goes so far."

[[claim]]
id = "onboarding-source-stops-helping"
statement = "From five labelled frames of the new camera, training on those alone matches training on them plus 775 frames from the source camera - the source set stops contributing."
value = 0.9902
where = []
source = "results/onboarding_cost.csv"
select = { backbone = "dinov2", k = "5" }
column = "target_only_mean"
note = "The control that reframes the transfer story. Compare against `adapted_mean` in the same row, which is equal to four decimal places. Holds for all three backbones."

# --- WP3-T6: augmentation across the camera boundary ------------------------------------

[[claim]]
id = "augmentation-light-recovers-empty"
statement = "Brightness-and-gamma augmentation takes empty-pitch recall on an unseen camera from 0.000 to 0.687, with no labels from that camera."
value = 0.6872
where = []
source = "results/augmentation_transfer.csv"
select = { preset = "light" }
column = "empty_recall"
note = "Compare the `baseline` row's 0.0000 in the same table, and the `none` row - four identical copies of each frame - which does not move it. One seed per preset, so read the ordering rather than the third decimal."

[[claim]]
id = "augmentation-full-erases-the-gain"
statement = "Turning every augmentation on scores 0.3479, the same as colour jitter alone and below no augmentation at all - even though it contains every effect that made `light` work."
value = 0.3479
where = []
source = "results/augmentation_transfer.csv"
select = { preset = "full" }
column = "macro_f1"
note = "The practical finding: match the augmentation to the shift being fought. Adding the rest does not dilute the benefit, it erases it - `full` returns empty-pitch recall to zero."
