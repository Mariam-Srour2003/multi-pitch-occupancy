# --- H3 and the false-play control -----------------------------------------------------

[[claim]]
id = "h3-cross-venue-dinov2"
statement = "DINOv2 holds 0.9297 ACTIVE_PLAY recall across unseen venues."
value = 0.9297
where = ["thesis/rq_matrix.md"]
source = "results/h3_cross_venue_recall.csv"
select = { model = "dinov2", held_out_venue = "MEAN_ACROSS_FOLDS" }
column = "play_recall"

[[claim]]
id = "h3-cross-venue-clock-rule"
statement = "The clock rule collapses to 0.219 across unseen venues, while the backbones hold above 0.86."
value = 0.219
where = ["thesis/rq_matrix.md"]
source = "results/h3_cross_venue_recall.csv"
select = { model = "clock_rule", held_out_venue = "MEAN_ACROSS_FOLDS" }
column = "play_recall"
note = "A lower bound: WP3-T5 found the lighting labels this rule reads are wrong for at least three clip venues, so quote the collapse rather than the number."

[[claim]]
id = "false-play-convnextv2"
statement = "ConvNeXtV2 calls 99.2% of held-out empty pitches a match."
value = 0.9918
where = ["README.md", "thesis/rq_matrix.md"]
source = "results/h3_with_false_play.csv"
select = { model = "convnextv2", held_out_venue = "MEAN_ACROSS_FOLDS" }
column = "false_play_rate"
note = "A false-play *rate*, and its complement is not accuracy. WP5-T2 found every learned probe scores near zero EMPTY accuracy on this set - DINOv2's much lower 0.309 comes with 0 of 243 correct, the rest answered MAINTENANCE - so quote the rate as the rate, never as evidence that a model recognises an empty pitch. See `false-play-is-not-accuracy`."

[[claim]]
id = "false-play-is-not-accuracy"
statement = "No model exceeds 0.165 accuracy on the 243 held-out empty frames; DINOv2, whose false-play rate is the lowest of the backbones at 0.309, gets none of them right."
value = 0.0
where = []
source = "results/fusion_head_ablation.csv"
select = { model = "dinov2", held_out_venue = "MEAN_ACROSS_FOLDS" }
column = "empty_accuracy"
note = "The guard on reading a low false-play rate as competence. The mechanism is the training mix - 518 ACTIVE_PLAY, 251 EMPTY, 6 MAINTENANCE, with class_weight=balanced giving the six-frame class a weight of 43 - so out-of-distribution frames land in MAINTENANCE. `where` is empty until this reaches the write-up; the ledger still re-derives the value."

[[claim]]
id = "false-play-clock-rule"
statement = "The clock rule, which never looks at the image, calls 2.1% of held-out empty pitches a match."
value = 0.0206
where = ["README.md"]
source = "results/h3_with_false_play.csv"
select = { model = "clock_rule", held_out_venue = "MEAN_ACROSS_FOLDS" }
column = "false_play_rate"

